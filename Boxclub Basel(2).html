<title>Boxclub Basel – Boxen in Basel seit 1924</title>
<meta name="description" content="Boxclub Basel, Klingental-Turnhalle (Boxkeller), Kasernenhof 2, 4058 Basel. Fitnessboxen, Kinder-, Junioren-, Wettkampf- und Personal Training. Probetraining: 3 Lektionen für CHF 20.">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--red:#d7261e;--ink:#07080a;--paper:#f3f1ec;--mute:#b9bdc2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--paper);font-family:Inter,system-ui,sans-serif}
#scroll{height:800vh}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.nav{position:fixed;top:0;left:0;right:0;z-index:8;display:flex;justify-content:space-between;align-items:center;
  padding:calc(clamp(18px,6vh,64px) + 10px + env(safe-area-inset-top,0px)) 5vw 12px;background:linear-gradient(#07080a 75%,#07080ad0)}
.logo{font-family:'Bebas Neue',Impact,sans-serif;font-size:20px;letter-spacing:.06em;text-decoration:none;color:var(--paper)}
.logo small{display:block;font:600 10px Inter,sans-serif;letter-spacing:.3em;color:var(--red)}
.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;font-weight:600;font-size:14px;
  padding:12px 22px;border-radius:999px;pointer-events:auto;transition:transform .2s,background .2s}
.btn:hover{background:#f03228;transform:translateY(-2px)}
.btn.ghost{background:transparent;border:1px solid #fff6}
.scene{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:center;
  padding:80px 5vw 60px;pointer-events:none;opacity:0;will-change:opacity,transform}
.scene>*{max-width:min(640px,100%)}
.eyebrow{font-weight:600;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--red);margin:0 0 14px}
h1,h2{font-family:'Bebas Neue',Impact,"Arial Narrow",sans-serif;font-weight:400;text-transform:uppercase;line-height:1;margin:0}
h1{font-size:clamp(54px,12vw,150px)}
h2{font-size:clamp(40px,8vw,96px)}
h1 span,h2 span{background:#000;padding:0 .1em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.lead{font-size:clamp(15px,1.6vw,18px);line-height:1.6;color:var(--mute);margin:20px 0 0;background:#000a;padding:10px 14px}
.quote{font-style:italic;color:var(--paper)}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chips a{pointer-events:auto;color:var(--paper);text-decoration:none;font-size:14px;border:1px solid #fff4;background:#000a;padding:9px 15px;border-radius:999px;transition:.2s}
.chips a:hover{border-color:var(--red);background:var(--red)}
.price{margin-top:18px;background:#000b;padding:6px 16px}
.price div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #fff2;font-size:15px}
.price div:last-child{border:0}
.price b{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:20px;white-space:nowrap}
.contact{margin-top:20px;background:#000b;padding:14px 16px;line-height:1.7;font-size:15px}
.contact a{color:var(--paper)}
.bar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--red);z-index:6}
.hint{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:5;
  font-size:11px;letter-spacing:.3em;color:#fff9;transition:opacity .4s}
.dots{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:10px}
.dots i{width:6px;height:6px;border-radius:50%;background:#fff4;transition:.3s}
.dots i.on{background:var(--red);transform:scale(1.6)}
@media(max-width:600px){.dots{display:none}}
#scenes .photos{display:flex;gap:10px;margin-top:22px;max-width:min(780px,100%)}
.photos figure{margin:0;flex:1;min-width:0;position:relative;overflow:hidden;border-radius:6px;background:#111}
.photos img{display:block;width:100%;height:clamp(120px,27vh,280px);object-fit:cover;filter:saturate(.9) contrast(1.05)}
.photos figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:11px;background:linear-gradient(#0000,#000d)}
#fade{position:fixed;inset:0;background:#000;z-index:9;pointer-events:none;transition:opacity 2.4s ease}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fx{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,#0000 50%,#000c 100%)}
.fx.grain{background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  opacity:.06;mix-blend-mode:overlay;animation:gr .7s steps(4) infinite}
@keyframes gr{0%{transform:translate(0,0)}25%{transform:translate(-30px,18px)}50%{transform:translate(22px,-26px)}75%{transform:translate(-14px,-10px)}100%{transform:translate(0,0)}}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.scene.low{justify-content:flex-end;padding-bottom:calc(13vh + env(safe-area-inset-bottom,0px))}
.scene.low>*{animation:up 1s cubic-bezier(.2,.7,.2,1) both}
.scene.low>:nth-child(1){animation-delay:2s}.scene.low>:nth-child(2){animation-delay:2.2s}.scene.low>:nth-child(3){animation-delay:2.4s}.scene.low>:nth-child(4){animation-delay:2.6s}
h1,h2{letter-spacing:.015em;line-height:.92;text-shadow:0 4px 40px #000,0 0 2px #000}
h2{font-size:clamp(60px,13vw,180px)}
h1 span,h2 span{background:none;padding:0}
.eyebrow{font-size:11px;letter-spacing:.45em;color:#c9a45c}
.eyebrow::before{content:"";display:inline-block;width:40px;height:1px;background:currentColor;margin-right:14px;vertical-align:middle}
.lead{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(19px,2.1vw,28px);line-height:1.35;
  color:#ece7dc;background:none;padding:0;text-shadow:0 2px 18px #000,0 0 3px #000}
.lead.quote{border-left:2px solid var(--red);padding-left:16px}
.btn{border-radius:2px;text-transform:uppercase;letter-spacing:.22em;font-size:12px;padding:15px 26px}
.chips a{border-radius:2px;letter-spacing:.1em;text-transform:uppercase;font-size:12px}
.price,.contact{background:#000c;border-top:1px solid #c9a45c88;border-radius:0}
.lb{position:fixed;left:0;right:0;height:clamp(18px,6vh,64px);background:#000;z-index:4;pointer-events:none}
button.btn{font-family:inherit;cursor:pointer}
.chips span{border:1px solid #fff4;background:#000a;padding:9px 15px;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.nf{position:relative;z-index:5;background:#141414;padding:6vh 0 30px}
.nf::before{content:"";position:absolute;left:0;right:0;top:-18vh;height:18vh;background:linear-gradient(#0000,#141414);pointer-events:none}
.nf-hero{padding:0 4vw 10px}
.nf-n{color:#e50914;font:400 clamp(22px,4vw,34px) 'Bebas Neue',Impact,sans-serif;letter-spacing:.14em}
.nf-hero h2{font-size:clamp(46px,9vw,110px);margin:6px 0 10px}
.nf-hero p{max-width:52ch;color:#b3b3b3;line-height:1.6;margin:0}
.nf-h{font:600 clamp(16px,2vw,22px) Inter,sans-serif;margin:30px 4vw 0;text-shadow:none;letter-spacing:0}
.nf-row{display:flex;gap:8px;overflow-x:auto;padding:16px 4vw 34px;scroll-snap-type:x mandatory;scrollbar-width:none}
.nf-row::-webkit-scrollbar{display:none}
.nf-c{position:relative;flex:none;width:clamp(210px,62vw,320px);aspect-ratio:16/9;border:0;padding:0;background:linear-gradient(135deg,#2a2a2a,#111);
  border-radius:4px;overflow:hidden;cursor:pointer;color:#fff;scroll-snap-align:start;transition:transform .25s,box-shadow .25s}
.nf-c:hover,.nf-c:focus-visible{transform:scale(1.1);z-index:2;box-shadow:0 12px 40px #000}
.nf-c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nf-c span{position:absolute;left:0;right:0;bottom:0;padding:28px 10px 8px;font:600 13px Inter,sans-serif;text-align:left;background:linear-gradient(#0000,#000e)}
.nf-c.rk::before{content:var(--n);position:absolute;left:8px;top:-2px;z-index:1;font:400 64px 'Bebas Neue',Impact,sans-serif;color:#0000;-webkit-text-stroke:2px #fff}
.nf-f{padding:36px 4vw 24px;color:#808080;font-size:13px;line-height:1.9}.nf-f a{color:#b3b3b3}
.modal{position:fixed;inset:0;z-index:20;background:#000d;display:flex;align-items:center;justify-content:center;padding:4vw;overflow:auto}
.modal[hidden]{display:none}
.m-box{position:relative;background:#181818;max-width:760px;width:100%;border-radius:6px;overflow:hidden;margin:auto}
.m-in{padding:20px 24px 26px;line-height:1.6}
.m-in img{display:block;margin:-20px -24px 16px;width:calc(100% + 48px);max-height:55vh;object-fit:cover}
.m-in h3{font:400 38px 'Bebas Neue',Impact,sans-serif;margin:0 0 8px}.m-in h4{margin:16px 0 4px;color:#c9a45c;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.m-in p{margin:0;color:#cfcfcf}.m-in .btn{margin-top:18px}
.m-x{position:absolute;right:10px;top:10px;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:18px;cursor:pointer}
@keyframes shim{0%{background-position:0 0}100%{background-position:200% 0}}
.nf-c.noimg{background:linear-gradient(135deg,#8a1019,#1a1012 70%)}
.nf-c.noimg span{inset:0;display:flex;align-items:center;padding:16px;font:400 clamp(26px,7vw,36px) 'Bebas Neue',Impact,sans-serif;letter-spacing:.03em;background:none;text-shadow:0 2px 12px #000}
.nf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px;padding:18px 4vw 10px}
.nf-grid h4{margin:0 0 6px;color:#c9a45c;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.nf-grid p{margin:0;color:#cfcfcf;line-height:1.6;font-size:15px}
.m-in .u{word-break:break-all;color:#fff;font-weight:600;margin:6px 0 0}.m-link{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.m-link .btn{margin:0}
a:focus-visible{outline:2px solid var(--red);outline-offset:3px}
</style>

function makeGraffiti(W,H,sd0,bigs,hole){
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H; const c=cv.getContext("2d");
  const tex=new THREE.CanvasTexture(cv); tex.encoding=THREE.sRGBEncoding; tex.anisotropy=8;
  const draw=()=>{ let sd=sd0; const R=()=>{sd=(sd*16807)%2147483647; return sd/2147483647;};
    const PAL=[["#ff3b47","#a3000f"],["#ffd23a","#d97a00"],["#27d3f2","#0a6fa8"],["#ff4fa3","#9b0f57"],["#a6f23a","#2d8a10"],["#ffffff","#8e98a3"],["#ff8a1f","#b13a00"]];
    const MK="'Permanent Marker',cursive", BN="'Bebas Neue',Impact,sans-serif";
    c.clearRect(0,0,W,H); c.fillStyle="#17191d"; c.fillRect(0,0,W,H);
    for(let y=0;y<H;y+=44) for(let x=-((y/44)%2)*60;x<W;x+=120){ const v=30+R()*22|0; c.fillStyle=`rgb(${v+8},${v+4},${v+2})`; c.fillRect(x+3,y+3,114,38); }
    for(let i=0;i<W*H/30000;i++){ const x=R()*W,y=R()*H,r=40+R()*120,g=c.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,"rgba(0,0,0,.35)"); g.addColorStop(1,"rgba(0,0,0,0)"); c.fillStyle=g; c.fillRect(x-r,y-r,r*2,r*2); }
    const spray=(x,y,r,col)=>{ c.fillStyle=col; c.globalAlpha=.3; for(let n=0;n<r*2;n++){ const a=R()*6.283,d=Math.sqrt(R())*r; c.fillRect(x+Math.cos(a)*d,y+Math.sin(a)*d,2,2);} c.globalAlpha=1; };
    const piece=(t,x,y,size,rot,pal,font)=>{ c.save(); c.translate(x,y); c.rotate(rot); c.font=size+"px "+font; c.textAlign="center"; c.lineJoin="round";
      spray(0,-size*.3,size*1.6,pal[0]); c.fillStyle="#0009"; c.fillText(t,9,9);
      c.lineWidth=size*.17; c.strokeStyle="#0a0a0c"; c.strokeText(t,0,0); c.lineWidth=size*.06; c.strokeStyle="#fff"; c.strokeText(t,0,0);
      const g=c.createLinearGradient(0,-size*.85,0,0); g.addColorStop(0,pal[0]); g.addColorStop(1,pal[1]); c.fillStyle=g; c.fillText(t,0,0);
      const w=c.measureText(t).width; for(let k=0;k<Math.max(3,t.length);k++){ const dx=(R()-.5)*w*.9,len=18+R()*size*.55; c.fillStyle=pal[1]; c.fillRect(dx-3,6,6,len); c.beginPath(); c.arc(dx,6+len,5,0,7); c.fill(); } c.restore(); };
    const star=(x,y,r,col)=>{ c.beginPath(); for(let k=0;k<10;k++){ const a=-Math.PI/2+k*Math.PI/5,d=k%2?r*.45:r; c.lineTo(x+Math.cos(a)*d,y+Math.sin(a)*d);} c.closePath(); c.lineWidth=7; c.strokeStyle="#0a0a0c"; c.stroke(); c.fillStyle=col; c.fill(); };
    const bolt=(x,y,s2,col)=>{ c.beginPath(); [[0,-1],[.45,-.1],[.1,-.1],[.5,1],[-.4,.1],[-.05,.1]].forEach(([a,b],k)=>c[k?"lineTo":"moveTo"](x+a*s2,y+b*s2)); c.closePath(); c.lineWidth=7; c.strokeStyle="#0a0a0c"; c.stroke(); c.fillStyle=col; c.fill(); };
    const W2=["TEAM","RESPECT","DISCIPLINE","ROUND 1","JAB","HOOK","BOX","BCB","FIGHT","GLOVES UP","NEVER QUIT","BASEL","KO","1924","PUNCH","FOCUS"];
    bigs.forEach(([t,fx,fy,sz,rot,pi,mk])=>piece(t,fx*W,fy*H,sz,rot,PAL[pi],mk?MK:BN));
    const n=Math.round(W*H/62000); for(let i=0;i<n;i++) piece(W2[i%W2.length],80+R()*(W-160),90+R()*(H-160),44+R()*52,(R()-.5)*.4,PAL[(R()*PAL.length)|0],R()<.6?MK:BN);
    for(let i=0;i<n/2.4;i++) star(60+R()*(W-120),60+R()*(H-120),22+R()*26,PAL[(R()*PAL.length)|0][0]);
    for(let i=0;i<n/4;i++) bolt(60+R()*(W-120),60+R()*(H-120),28+R()*24,PAL[(R()*PAL.length)|0][0]);
    for(let i=0;i<n*1.2;i++) spray(R()*W,R()*H,30+R()*60,PAL[(R()*PAL.length)|0][0]);
    if(hole) c.clearRect(...hole);

function figure({skin,shirt,shorts,glove=0xd7261e,s,x,y,z,ry=0}){
  const root=new THREE.Group(); root.scale.setScalar(s); root.position.set(x,y,z); root.rotation.y=ry; scene.add(root);
  const legs=[-1,1].map(sx=>{const p=new THREE.Group(); p.position.set(sx*.12,.95,0); root.add(p);
    const l=mk(G.leg,skin); l.position.y=-.45; p.add(l); const sh=mk(G.shoe,0x15171a); sh.position.set(0,-.9,-.04); p.add(sh); return p;});
  const hip=mk(G.hip,shorts); hip.position.y=.97; root.add(hip);
  const T=new THREE.Group(); T.position.y=.95; root.add(T);
  const tor=mk(G.torso,shirt); tor.position.y=.32; T.add(tor);
  const head=mk(G.head,skin); head.position.y=.76; T.add(head);
  const hair=mk(new THREE.SphereGeometry(.15,12,8,0,Math.PI*2,0,Math.PI/2),0x1a1410); hair.position.y=.78; T.add(hair);
  const arms=[-1,1].map(sx=>{const p=new THREE.Group(); p.position.set(sx*.29,.56,0); T.add(p);
    const a=mk(G.arm,skin); a.position.y=-.27; p.add(a); const g=mk(G.glove,glove); g.position.y=-.6; p.add(g); return p;});
  return {root,legs,arms,T,s,pa:0,pb:0};
}
function walkAnim(f,ph){ f.T.rotation.set(0,0,0);
  f.legs[0].rotation.x=Math.sin(ph)*.7; f.legs[1].rotation.x=-Math.sin(ph)*.7;
  f.arms[0].rotation.set(-Math.sin(ph)*.5,0,0); f.arms[1].rotation.set(Math.sin(ph)*.5,0,0); }
function boxAnim(f,tm,sp,ph,onHit){
  const a=Math.sin(tm*sp+ph), b=Math.sin(tm*sp+ph+Math.PI), eL=Math.max(0,a), eR=Math.max(0,b);
  f.arms[0].rotation.set(1.15+eL*.42,0,.12); f.arms[1].rotation.set(1.15+eR*.42,0,-.12);
  f.T.rotation.set(.1,(eR-eL)*.3,0);
  const w=Math.sin(tm*sp*.5+ph)*.15; f.legs[0].rotation.x=w; f.legs[1].rotation.x=-w;
  if(onHit){ if(f.pa<.9&&eL>=.9)onHit(); if(f.pb<.9&&eR>=.9)onHit(); } f.pa=eL; f.pb=eR; }

const SK=[0xf0c8a0,0xc68a5c,0x8d5a3a,0xe0b08a,0xa86f48];
const SH=[0x2f6bff,0xffffff,0xd7261e,0x1b1f26,0x2fa36b,0xf2c200];
// Training an den Sandsäcken: Kinder, Junioren, Erwachsene
const trainers=[1.45,1.2,.95,1.45,1.0].map((s,i)=>{
  const f=figure({skin:SK[i%5],shirt:SH[i%6],shorts:SH[(i+2)%6],s,x:4+i*2.4,y:0,z:-29.5+.68*s+.05,ry:0});
  return {f,bag:bagList[i],sp:7+i*.7,ph:i*1.3}; });
// Schattenboxen am Rand + Sparring im Ring
const shadow=[[.95,7,-12.5],[1.2,8.6,-14.5],[1.0,7.6,-17]].map(([s,x,z],i)=>
  ({f:figure({skin:SK[(i+1)%5],shirt:SH[(i+3)%6],shorts:SH[i],s,x,y:0,z,ry:-Math.PI/2}),sp:6.5+i*.8,ph:i*2}));
const spar=[figure({skin:SK[2],shirt:SK[2],shorts:0xd7261e,s:1.45,x:19.3,y:.9,z:-16,ry:Math.PI/2}),
            figure({skin:SK[0],shirt:SK[0],shorts:0x2f6bff,glove:0x2f6bff,s:1.45,x:17.1,y:.9,z:-16,ry:-Math.PI/2})];
// Boxer, die durch die Tür zum Ring laufen und hineingehen
const SPD=1.9, STAY=6;
function mkPath(endz){const P=[[0,0,-1.8],[0,0,3.2],[11,0,3.2],[11,0,-16],[11.6,0,-16],[12.4,.5,-16],[13.2,.9,-16],[15.2,.9,endz]].map(p=>new THREE.Vector3(...p));
  const L=[0]; for(let i=1;i<P.length;i++)L.push(L[i-1]+P[i].distanceTo(P[i-1])); return {P,L,len:L[L.length-1]};}
const walkers=[[-12.5,2],[-16,3],[-19.5,4]].map(([ez,k],i)=>{const path=mkPath(ez), cyc=path.len/SPD+STAY+1;
  return {f:figure({skin:SK[k],shirt:SK[k],shorts:SH[[2,3,0][i]],s:1.45,x:0,y:0,z:1}),path,cyc,off:i*cyc/3}; });
const ang=(a,b)=>{let d=b-a; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; return d;};
let lastT=0;
function animate(tm){
  const dt=Math.min(tm-lastT,.05); lastT=tm;
  trainers.forEach(o=>boxAnim(o.f,tm,o.sp,o.ph,()=>{o.bag.v+=.9*o.f.s/1.45;}));
  bagList.forEach(b=>{b.v+=(-16*b.th-1.5*b.v)*dt; b.th+=b.v*dt; b.g.rotation.x=b.th;});
  shadow.forEach(o=>boxAnim(o.f,tm,o.sp,o.ph));
  boxAnim(spar[0],tm,6.2,0); boxAnim(spar[1],tm,6.2,1.7);
  walkers.forEach(w=>{
    const c=(tm+w.off)%w.cyc, walkT=w.path.len/SPD, r=w.f.root;
    if(c<walkT){
      const d=c*SPD, {P,L}=w.path; let i=1; while(i<L.length-1&&L[i]<d)i++;
      const k=(d-L[i-1])/(L[i]-L[i-1]); r.position.lerpVectors(P[i-1],P[i],k);
      const dx=P[i].x-P[i-1].x, dz=P[i].z-P[i-1].z;
      r.rotation.y+=ang(r.rotation.y,Math.atan2(-dx,-dz))*.12; walkAnim(w.f,d*3.4);
      r.scale.setScalar(1.45*Math.max(.01,Math.min(1,c/.25)));
    } else {
      const P=w.path.P[w.path.P.length-1]; r.position.copy(P);
      r.rotation.y+=ang(r.rotation.y,-Math.PI/2)*.12; boxAnim(w.f,tm,6+w.off%2,w.off);
      r.scale.setScalar(1.45*Math.max(.01,Math.min(1,(w.cyc-c)/.8)));
    }
  });
}

const host=document.getElementById("scenes"), dots=document.getElementById("dots");
const els=SECTIONS.map(s=>{const d=document.createElement("section");d.className="scene "+(s.cls||"");d.innerHTML=s.html;host.appendChild(d);
  const dot=document.createElement("i");dots.appendChild(dot);return d;});
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
let target=0,cur=0,mx=0,my=0;
function onScroll(){const m=document.getElementById("scroll").offsetHeight-innerHeight;target=m>0?clamp(scrollY/m,0,1):0;
  document.getElementById("hint").style.opacity=target>.02?0:1;}
addEventListener("scroll",onScroll,{passive:true}); onScroll();
addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;},{passive:true});
const look=new THREE.Vector3(), n=SECTIONS.length;

function tick(t){
  animate(t*.001);
  cur+=(target-cur)*(reduce?1:.06);
  const sc=clamp(cur,0,1)*(n-1);                 // 0 … n-1
  const i=Math.min(Math.floor(sc),n-2), f=sc-i;
  const e=f<.2?0:f>.8?1:sm((f-.2)/.6);           // Halten – Fliegen – Halten
  const u=(i+e)/(n-1);
  posCurve.getPoint(u,camera.position); tgtCurve.getPoint(u,look);
  const mv=Math.sin(e*Math.PI);                    // 0 im Stillstand, 1 mitten im Flug
  let ie=1;
  if(!reduce){
    ie=1-Math.pow(1-Math.min(1,t*.001/4.5),3);       // Intro: langsame Fahrt auf die Wand zu
    camera.position.z+=(1-ie)*9; camera.position.y-=(1-ie)*.5;
    camera.position.x+=Math.sin(t*.0013)*.04+Math.sin(t*.0031)*.02+mx*.4;   // Handkamera
    camera.position.y+=Math.sin(t*.0017)*.03-my*.2;
  }
  camera.lookAt(look);
  if(!reduce) camera.rotateZ(mv*.03*(i%2?1:-1)+Math.sin(t*.0011)*.002);   // leichte Schräglage im Flug
  camera.fov=baseFov-(reduce?0:mv*3+(1-ie)*6); camera.updateProjectionMatrix();
  warm.intensity=.9+Math.sin(t*.011)*.05+Math.sin(t*.027)*.03; doorLight.intensity=2.4+Math.sin(t*.013)*.15;
  beam.material.opacity=.8+Math.sin(t*.004)*.1; streak.material.opacity=.45+Math.sin(t*.006)*.1+Math.sin(t*.019)*.05;
  spot.intensity=3+Math.sin(t*.002)*.25; dust.rotation.y=t*.00003;
  els.forEach((el,k)=>{
    const d=Math.abs(sc-k), o=clamp(1-(d-.2)/.2,0,1);
    el.style.opacity=o; el.style.transform=`translateY(${(sc>k?-1:1)*(1-o)*28}px)`;
    el.style.visibility=o<.01?"hidden":"visible";
    el.querySelectorAll("a,button").forEach(a=>a.style.pointerEvents=o>.6?"auto":"none");
  });
  [...dots.children].forEach((d,k)=>d.classList.toggle("on",k===Math.round(sc)));
  document.getElementById("bar").style.width=cur*100+"%";
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
setTimeout(()=>{document.getElementById('fade').style.opacity=0;},150);
let baseFov=58;
function fit(){const pt=innerWidth/innerHeight<1; camera.aspect=innerWidth/innerHeight; baseFov=pt?74:58; camera.fov=baseFov; camera.updateProjectionMatrix();
  posCurve.points[0].x=pt?0:-2; tgtCurve.points[0].x=pt?0:-3; tgtCurve.points[0].y=pt?3.8:3.6;}
